<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TwinPixel Games</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1f2a44 0%, #0d1018 70%);
      color: #e8ecf4;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 520px; }
    h1 {
      font-size: 2.4rem;
      margin: 0 0 12px;
      letter-spacing: 0.5px;
    }
    p { font-size: 1.05rem; line-height: 1.6; color: #aab3c5; margin: 0 0 8px; }
    .dot { color: #4f8cff; }
    footer { margin-top: 28px; font-size: 0.85rem; color: #6b7689; }
  </style>
</head>
<body>
  <main class="card">
    <h1>TwinPixel Games<span class="dot">.</span></h1>
    <p>We design and publish mobile games.</p>
    <p>This site hosts our <code>app-ads.txt</code> for advertising partners.</p>
    <footer>&copy; TwinPixel Games</footer>
  </main>
</body>
</html>
